name: Build and deploy Node.js app to Azure Web App - crgolden-churches

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    outputs:
      playwright-version: ${{ steps.playwright-version.outputs.version }}
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Cache npm packages
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Fix LCOV paths for SonarQube
        run: sed -i 's|\\|/|g' coverage/lcov.info

      - name: Get Playwright version
        id: playwright-version
        run: |
          VERSION=$(node -e "console.log(require('./package-lock.json').packages['node_modules/@playwright/test'].version)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browsers cache
        id: cache-playwright
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npm run playwright:install

      - name: Save Playwright browsers cache
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Run E2E tests
        run: npm run e2e

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload Playwright failure artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: churches-playwright-artifacts
          path: playwright-artifacts/
          if-no-files-found: ignore

      - name: Report E2E results
        if: always() && github.actor != 'dependabot[bot]'
        shell: pwsh
        env:
          AZURE_DEVOPS_EXT_PAT: ${{ secrets.AZURE_DEVOPS_EXT_PAT }}
        run: |
          $appName     = 'Churches'
          $suiteName   = 'E2E'
          $junitPath   = 'playwright-results.xml'

          if (-not (Test-Path $junitPath)) {
              Write-Warning "No JUnit XML found at $junitPath - E2E tests produced no results. Skipping ADO publish."
              exit 0
          }
          [xml]$xml  = Get-Content $junitPath
          $suites    = @($xml.testsuites.testsuite)
          $allCases  = @($suites | ForEach-Object { @($_.testcase) } | Where-Object { $_ -ne $null })

          $adoHeaders = @{ Authorization = "Basic $([Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes(":$env:AZURE_DEVOPS_EXT_PAT")))" }
          $adoBase    = 'https://dev.azure.com/crgolden/Churches/_apis/test'
          $adoVer     = 'api-version=7.1'

          function Invoke-Ado {
              param([string]$Method, [string]$Url, [object]$Body)
              Invoke-RestMethod -Method $Method -Uri $Url -Headers $adoHeaders `
                  -ContentType 'application/json' -Body (ConvertTo-Json -InputObject $Body -Depth 20 -Compress)
          }

          $adoResults = foreach ($tc in $allCases) {
              $outcome    = if ($tc.failure -ne $null) { 'Failed' } else { 'Passed' }
              $durationMs = [double]([double]$tc.time * 1000)
              @{ testCaseTitle        = $tc.name
                 automatedTestName    = "$($tc.classname) > $($tc.name)"
                 automatedTestStorage = $appName
                 automatedTestType    = 'Playwright'
                 outcome              = $outcome
                 durationInMs         = [int]$durationMs
                 errorMessage         = $tc.failure.message
                 stackTrace           = $tc.failure.'#text'
                 state                = 'Completed'
                 comment              = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" }
          }

          $totalMs    = ($allCases | ForEach-Object { [double]$_.time * 1000 } | Measure-Object -Sum).Sum
          $startedDate = [DateTimeOffset]::UtcNow.AddMilliseconds(-$totalMs).ToString('O')

          $run = Invoke-Ado POST "$adoBase/runs?$adoVer" @{
              name        = "$appName $suiteName Playwright - $env:GITHUB_RUN_NUMBER"
              automated   = $true
              state       = 'InProgress'
              startedDate = $startedDate
              comment     = "GitHub Actions run $env:GITHUB_RUN_ID" }
          Invoke-Ado POST "$adoBase/runs/$($run.id)/results?$adoVer" @($adoResults) | Out-Null
          Invoke-Ado POST "$adoBase/runs/$($run.id)/attachments?$adoVer" @{
              stream         = [Convert]::ToBase64String([IO.File]::ReadAllBytes((Resolve-Path $junitPath)))
              fileName       = 'playwright-results.xml'
              comment        = 'JUnit XML'
              attachmentType = 'GeneralAttachment' } | Out-Null
          Invoke-Ado PATCH "$adoBase/runs/$($run.id)?$adoVer" @{
              state         = 'Completed'
              completedDate = [DateTimeOffset]::UtcNow.ToString('O') } | Out-Null
          Write-Host "Published $($adoResults.Count) results to Azure DevOps run $($run.id)."

      - name: SonarCloud analysis
        if: github.actor != 'dependabot[bot]'
        uses: sonarsource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.exclusions=**/node_modules/**,**/*.d.ts,e2e/**,instrumentation.mjs
            -Dsonar.coverage.exclusions=e2e/**,scripts/**,**/*.config.*,src/test-setup.ts,src/proxy.conf.js,src/environments/**,src/main.ts,src/main.server.ts,src/server.ts,src/app/app.routes.server.ts
            -Dsonar.test.inclusions=**/*.spec.ts
            -Dsonar.scanner.skipJreProvisioning=true

      - name: Build (production)
        run: npm run build

      - name: Prune devDependencies
        run: npm prune --omit=dev

      - name: Assemble deployment package
        run: |
          mkdir -p publish
          cp -r dist publish/dist
          cp -r node_modules publish/node_modules
          cp instrumentation.mjs publish/instrumentation.mjs
          cp package.json publish/package.json
          cp package-lock.json publish/package-lock.json

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v7
        with:
          name: node-app
          path: publish/

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      webapp-url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Download artifact from build job
        uses: actions/download-artifact@v7
        with:
          name: node-app
          path: publish/

      - name: Login to Azure
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca  # v3.0.1
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C4CF7EE65BC442259601FFDB3B86513D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D1FC42A8E15547A18F5A397D64F179D0 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C6E3B3EB281E4D4C85FC7D1501EE1170 }}

      - name: Verify App Service Node runtime matches the build
        run: |
          expected="NODE|$(tr -d '[:space:]' < .nvmrc)-lts"
          actual=$(az webapp config show --name 'crgolden-churches' --resource-group 'crgolden' \
            --query linuxFxVersion --output tsv)
          if [ "$actual" != "$expected" ]; then
            echo "::error::App Service runtime is '$actual' but this build targets '$expected'. Update the App Service stack or .nvmrc before deploying."
            exit 1
          fi
          echo "App Service runtime '$actual' matches the build."

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383  # v3.0.8
        with:
          app-name: 'crgolden-churches'
          slot-name: 'Production'
          package: publish/
          startup-command: 'node --import ./instrumentation.mjs dist/churches.client/server/server.mjs'

  smoke:
    name: Post-deploy smoke
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Restore npm cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Restore Playwright browsers cache
        id: cache-playwright
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ needs.build.outputs.playwright-version }}

      - name: Install Playwright browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npm run playwright:install

      - name: Warm up deployed app
        run: |
          url="${{ needs.deploy.outputs.webapp-url }}/health"
          for i in $(seq 1 12); do
            if curl -sf "$url" | grep -q 'Healthy'; then
              echo "App is healthy after $i attempt(s)."
              break
            fi
            if [ "$i" -eq 12 ]; then
              echo "Warning: app did not report Healthy after 12 attempts — proceeding anyway."
            else
              echo "Attempt $i: not ready yet, waiting 10s..."
              sleep 10
            fi
          done

      - name: Run smoke tests
        env:
          SmokeBaseUrl: ${{ needs.deploy.outputs.webapp-url }}
        run: npm run e2e:smoke

      - name: Upload smoke Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload smoke Playwright failure artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: churches-smoke-playwright-artifacts
          path: playwright-artifacts/
          if-no-files-found: ignore

      - name: Report smoke results
        if: always()
        shell: pwsh
        env:
          AZURE_DEVOPS_EXT_PAT: ${{ secrets.AZURE_DEVOPS_EXT_PAT }}
        run: |
          $appName     = 'Churches'
          $suiteName   = 'Smoke'
          $junitPath   = 'playwright-results.xml'

          if (-not (Test-Path $junitPath)) {
              Write-Warning "No JUnit XML found at $junitPath - smoke tests produced no results. Skipping ADO publish."
              exit 0
          }
          [xml]$xml  = Get-Content $junitPath
          $suites    = @($xml.testsuites.testsuite)
          $allCases  = @($suites | ForEach-Object { @($_.testcase) } | Where-Object { $_ -ne $null })

          $adoHeaders = @{ Authorization = "Basic $([Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes(":$env:AZURE_DEVOPS_EXT_PAT")))" }
          $adoBase    = 'https://dev.azure.com/crgolden/Churches/_apis/test'
          $adoVer     = 'api-version=7.1'

          function Invoke-Ado {
              param([string]$Method, [string]$Url, [object]$Body)
              Invoke-RestMethod -Method $Method -Uri $Url -Headers $adoHeaders `
                  -ContentType 'application/json' -Body (ConvertTo-Json -InputObject $Body -Depth 20 -Compress)
          }

          $adoResults = foreach ($tc in $allCases) {
              $outcome    = if ($tc.failure -ne $null) { 'Failed' } else { 'Passed' }
              $durationMs = [double]([double]$tc.time * 1000)
              @{ testCaseTitle        = $tc.name
                 automatedTestName    = "$($tc.classname) > $($tc.name)"
                 automatedTestStorage = $appName
                 automatedTestType    = 'Playwright'
                 outcome              = $outcome
                 durationInMs         = [int]$durationMs
                 errorMessage         = $tc.failure.message
                 stackTrace           = $tc.failure.'#text'
                 state                = 'Completed'
                 comment              = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" }
          }

          $totalMs     = ($allCases | ForEach-Object { [double]$_.time * 1000 } | Measure-Object -Sum).Sum
          $startedDate = [DateTimeOffset]::UtcNow.AddMilliseconds(-$totalMs).ToString('O')

          $run = Invoke-Ado POST "$adoBase/runs?$adoVer" @{
              name        = "$appName $suiteName Playwright - $env:GITHUB_RUN_NUMBER"
              automated   = $true
              state       = 'InProgress'
              startedDate = $startedDate
              comment     = "GitHub Actions run $env:GITHUB_RUN_ID" }
          Invoke-Ado POST "$adoBase/runs/$($run.id)/results?$adoVer" @($adoResults) | Out-Null
          Invoke-Ado POST "$adoBase/runs/$($run.id)/attachments?$adoVer" @{
              stream         = [Convert]::ToBase64String([IO.File]::ReadAllBytes((Resolve-Path $junitPath)))
              fileName       = 'playwright-results.xml'
              comment        = 'JUnit XML'
              attachmentType = 'GeneralAttachment' } | Out-Null
          Invoke-Ado PATCH "$adoBase/runs/$($run.id)?$adoVer" @{
              state         = 'Completed'
              completedDate = [DateTimeOffset]::UtcNow.ToString('O') } | Out-Null
          Write-Host "Published $($adoResults.Count) results to Azure DevOps run $($run.id)."
