name: Build and deploy Node.js app to Azure Web App - crgolden-churches

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    outputs:
      playwright-version: ${{ steps.playwright-version.outputs.version }}
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com

      - name: Cache npm packages
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install npm dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Type-check E2E specs
        run: npm run typecheck:e2e

      - name: Type-check unit specs
        run: npm run typecheck:spec

      - name: Lint stylesheets
        run: npm run lint:css

      - name: Get Playwright version
        id: playwright-version
        run: |
          VERSION=$(node -e "console.log(require('./package-lock.json').packages['node_modules/@playwright/test'].version)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browsers cache
        id: cache-playwright
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        run: npm run playwright:install

      - name: Save Playwright browsers cache
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Fix LCOV paths for SonarQube
        run: sed -i 's|\\|/|g' coverage/lcov.info

      - name: Run E2E tests
        id: e2e
        run: npm run e2e

      - name: Assert E2E executed at least its floor
        if: always()
        run: |
          if [ ! -f playwright-results.xml ]; then
            echo "::error::playwright-results.xml is missing - the E2E suite never reported."
            exit 1
          fi
          floor=$(node -p "require('./e2e/e2e-settings.json').executedTestFloor")
          tests=$(grep -o 'tests="[0-9]*"' playwright-results.xml | head -1 | grep -o '[0-9]*')
          skipped=$(grep -o 'skipped="[0-9]*"' playwright-results.xml | head -1 | grep -o '[0-9]*')
          executed=$(( ${tests:-0} - ${skipped:-0} ))
          echo "E2E executed ${executed} (tests ${tests:-0}, skipped ${skipped:-0}), floor ${floor}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${floor}" -le 0 ] || [ "${executed}" -lt "${floor}" ]; then
            echo "::error::E2E executed ${executed} tests, below its floor of ${floor}."
            exit 1
          fi

      - name: Publish E2E scenario results
        if: ${{ !cancelled() && (steps.e2e.outcome == 'success' || steps.e2e.outcome == 'failure') && github.actor != 'dependabot[bot]' }}
        env:
          PGHOST: ${{ vars.TEST_RESULTS_PGHOST }}
          PGDATABASE: ${{ vars.TEST_RESULTS_PGDATABASE }}
          PGUSER: ${{ vars.TEST_RESULTS_PGUSER }}
          PGSSLMODE: ${{ vars.TEST_RESULTS_PGSSLMODE }}
          PGPASSWORD: ${{ secrets.TEST_RESULTS_PGPASSWORD }}
        run: npx --no -- publish-bdd-results --app ${{ vars.TEST_RESULTS_APP }} "$(node -p "require('./e2e/e2e-settings.json').cucumberMessagesFile")"

      - name: Upload Cucumber report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: churches-cucumber-report
          path: cucumber-report/
          if-no-files-found: ignore

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload Playwright failure artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: churches-playwright-artifacts
          path: playwright-artifacts/
          if-no-files-found: ignore

      - name: Check template classes against the built CSS
        run: npm run lint:utilities

      - name: SonarCloud analysis
        if: github.actor != 'dependabot[bot]'
        uses: sonarsource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.exclusions=**/node_modules/**,**/*.d.ts,e2e/**,integration/**,.features-gen/**,instrumentation.mjs,**/*.spec.ts
            -Dsonar.tests=src
            -Dsonar.coverage.exclusions=e2e/**,integration/**,scripts/**,**/*.config.*,src/test-setup*.ts,gate.ps1,src/proxy.conf.js,src/environments/**,src/main.ts,src/main.server.ts,src/server.ts,src/app/app.routes.server.ts
            -Dsonar.test.inclusions=**/*.spec.ts
            -Dsonar.qualitygate.wait=true
            -Dsonar.scanner.skipJreProvisioning=true

      - name: Fail on open Sonar issues
        if: github.actor != 'dependabot[bot]'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $scope = if ($env:PULL_REQUEST) { "pullRequest=$env:PULL_REQUEST" } else { "branch=$env:BRANCH" }
          $auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("$($env:SONAR_TOKEN):"))
          $report = Invoke-RestMethod -Headers @{ Authorization = "Basic $auth" } -Uri "https://sonarcloud.io/api/issues/search?componentKeys=$env:SONAR_PROJECT_KEY&$scope&issueStatuses=OPEN,CONFIRMED&ps=500"
          foreach ($issue in $report.issues) {
            Write-Output "::error file=$($issue.component -replace '^[^:]*:'),line=$($issue.line)::$($issue.rule) $($issue.message)"
          }
          Write-Output "$($report.total) open Sonar issue(s) on $scope"
          if ($null -eq $report.total -or $report.total -ne 0) { exit 1 }

      - name: Build (production)
        run: npm run build

      - name: Prune devDependencies
        run: npm prune --omit=dev

      - name: Assemble deployment package
        run: |
          mkdir -p publish
          cp -r dist publish/dist
          cp -r node_modules publish/node_modules
          cp instrumentation.mjs publish/instrumentation.mjs
          cp package.json publish/package.json
          cp package-lock.json publish/package-lock.json

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v7
        with:
          name: node-app
          path: publish/

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      webapp-url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Download artifact from build job
        uses: actions/download-artifact@v7
        with:
          name: node-app
          path: publish/

      - name: Login to Azure
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca  # v3.0.1
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C4CF7EE65BC442259601FFDB3B86513D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D1FC42A8E15547A18F5A397D64F179D0 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C6E3B3EB281E4D4C85FC7D1501EE1170 }}

      - name: Verify App Service Node runtime matches the build
        run: |
          expected="NODE|$(tr -d '[:space:]' < .nvmrc)-lts"
          actual=$(az webapp config show --name 'crgolden-churches' --resource-group 'crgolden' \
            --query linuxFxVersion --output tsv)
          if [ "$actual" != "$expected" ]; then
            echo "::error::App Service runtime is '$actual' but this build targets '$expected'. Update the App Service stack or .nvmrc before deploying."
            exit 1
          fi
          echo "App Service runtime '$actual' matches the build."

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383  # v3.0.8
        with:
          app-name: 'crgolden-churches'
          slot-name: 'Production'
          package: publish/
          startup-command: 'node --import ./instrumentation.mjs dist/churches.client/server/server.mjs'
